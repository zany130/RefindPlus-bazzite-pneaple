# rEFInd Bazzite Pneaple theme — artwork only
# Intended to be included from /EFI/refind/refind.conf.
# IMPORTANT: No menuentry, scanfor, showtools, resolution or Secure Boot changes here.
# Paths are relative to the directory containing refind_x64.efi.

icons_dir themes/rEFInd-bazzite-pneaple/icons
banner themes/rEFInd-bazzite-pneaple/background.png
banner_scale fillscreen

big_icon_size 256
small_icon_size 96
selection_big themes/rEFInd-bazzite-pneaple/selection_big.png
selection_small themes/rEFInd-bazzite-pneaple/selection_small.png
