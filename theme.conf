# Bazzite Pneaple for RefindPlus with tool_row_tune
# No boot entry, loader, scanning, firmware or Secure Boot changes.
# Shadow-rEFInd AGPL-3.0 assets: third_party/Shadow-rEFInd-AGPL-3.0.txt
icons_dir themes/RefindPlus-bazzite-pneaple/icons
banner themes/RefindPlus-bazzite-pneaple/background.png
banner_scale fillscreen
big_icon_size 128
small_icon_size 48
selection_big themes/RefindPlus-bazzite-pneaple/selection_big.png
selection_small themes/RefindPlus-bazzite-pneaple/selection_small.png

# Keep the intended 1080p icon sizes rather than the automatic HiDPI heuristic.
# For 4K, include profiles/2160p.conf after this file in the MAIN config.conf.
scale_ui 99
hideui hints
# Deliberately exceeds the available travel: the patched layout clamps the
# tools to the lowest safe position, reserving the shared label and timeout.
# Positive values move up; negative values move down. Stock builds ignore this.
tool_row_tune -10000
