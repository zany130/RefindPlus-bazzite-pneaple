name: Temporary Pneaple visual proof
on:
  push:
    branches: [visual/pneaple-concept-polish]
permissions:
  contents: write
jobs:
  render-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - name: Export lightweight static background proof
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("background.png").convert("RGB")
          im.resize((1200,675),Image.Resampling.LANCZOS).save("tmp_pneaple_artwork_review.jpg",quality=77,optimize=True)
          print("Exported artwork preview:",im.size)
          PY
      - name: Commit preview (to be removed before PR)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_pneaple_artwork_review.jpg
          git commit -m "Temporary Pneaple visual proof for review"
          git push origin HEAD:visual/pneaple-concept-polish
