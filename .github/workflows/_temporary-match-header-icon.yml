name: Temporary match Bazzite icon to header
on:
  push:
    branches: [visual/pneaple-concept-polish]
permissions:
  contents: write
jobs:
  icon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - name: Extract original purple header emblem as a transparent icon
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          p = "background.png"
          source=Image.open(p).convert("RGB")
          assert source.size == (3840,2160), source.size
          # The approved header logo is at this location in the final wallpaper.
          # Isolate the emblem only; do not modify the background itself.
          box = (1455,130,1689,346)
          a=np.array(source.crop(box),dtype=np.float32)
          h,w=a.shape[:2]
          Y,X=np.mgrid[0:h,0:w].astype("float32")
          brightness=np.max(a,axis=2)
          opacity=np.clip((brightness-50)/125,0,1)
          # Feather out backdrop pixels outside the original icon/glow region.
          rad=np.sqrt(((X/w-0.49)/0.48)**2 + ((Y/h-0.49)/0.49)**2)
          opacity *= np.clip((1.1-rad)*9,0,1)
          rgba=np.dstack((a.astype("uint8"),np.round(opacity*255).astype("uint8")))
          icon=Image.fromarray(rgba,"RGBA").resize((128,128),Image.Resampling.LANCZOS)
          icon.save("icons/os_bazzite.png",optimize=True)
          print("Created transparent icon to match the top purple header logo:",icon.size)
          PY
      - name: Commit icon only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/os_bazzite.png
          git diff --cached --quiet && exit 0
          git commit -m "Match Bazzite icon to purple header emblem"
          git push origin HEAD:visual/pneaple-concept-polish
